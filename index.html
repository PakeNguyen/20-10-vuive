<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng 20/10 💕</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #ffe4f2;
    font-family: 'Comic Sans MS', cursive;
  }

  .intro, .main, .troll {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1s ease;
  }

  .intro {
    background-color: #ffd6eb;
    background-image: url('https://i.pinimg.com/originals/f2/da/44/f2da446cdf290fcb2b6e5ed88ddc8ed0.png');
    background-repeat: repeat;
    text-align: center;
  }

  .heart {
    font-size: 80px;
    animation: beat 1s infinite alternate;
  }
  @keyframes beat {
    to { transform: scale(1.2); }
  }

  .intro button {
    background: linear-gradient(45deg, #ff7eb9, #ff65a3);
    color: white;
    font-size: 22px;
    padding: 14px 32px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(255,105,180,0.4);
    transition: all 0.3s ease;
  }

  .intro button:hover {
    transform: scale(1.05);
    background: linear-gradient(45deg, #ff91c6, #ff78b6);
    box-shadow: 0 8px 15px rgba(255,105,180,0.5);
  }

  .main {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

.dog {
    width: 250px;
    height: 250px;
    background-image: url('./funny_dog.png');
    background-size: cover;
    background-position: center;
    border-radius: 50%;
    animation: bounce 2s infinite ease-in-out;
    box-shadow: 0 4px 10px rgba(255,182,193,0.6);
}

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }

  .message {
    font-size: 42px;
    color: #ff69b4;
    text-shadow: 2px 2px 6px rgba(255,255,255,0.8);
    opacity: 0;
    margin-top: 20px;
    animation: appear 2s forwards ease-in-out 2s, jump 2s infinite ease-in-out 4s;
  }

  @keyframes appear {
    to { opacity: 1; transform: scale(1.2); }
  }

  @keyframes jump {
    0%,100% { transform: translateY(0) scale(1.2); }
    50% { transform: translateY(-10px) scale(1.25); }
  }

  .popup {
    display: none;
    position: fixed;
    top: 12%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #fff0f5;
    padding: 20px 40px;
    border-radius: 20px;
    font-size: 24px;
    color: #ff1493;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    text-align: center;
  }

  .flower {
    position: absolute;
    width: 50px;
    height: 50px;
    background-image: url('https://cdn-icons-png.flaticon.com/512/616/616408.png');
    background-size: cover;
    animation: bloom 3s ease forwards;
  }

  @keyframes bloom {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .heart-fall {
    position: fixed;
    font-size: 24px;
    color: #ff69b4;
    animation: fall 5s linear infinite;
    z-index: 9999;
    pointer-events: none;
  }

  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }

  .button-flower {
    margin-top: 20px;
    background: linear-gradient(45deg, #ff85c1, #ffb6c1);
    color: white;
    font-size: 22px;
    padding: 12px 28px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(255,105,180,0.4);
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 1.2s ease, transform 1s ease;
  }

  .button-flower.show {
    opacity: 1;
    transform: scale(1);
  }

  .button-flower:hover {
    transform: scale(1.08);
    background: linear-gradient(45deg, #ff9ecf, #ffc0cb);
    box-shadow: 0 8px 16px rgba(255,105,180,0.6);
  }

  .troll {
    display: none;
    flex-direction: column;
    background-color: #ffebf5;
    justify-content: center;
    align-items: center;
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  /* 💸 Chữ “Cho xin 500k” – nháy nhanh & nhảy nhanh hơn */
  .troll h1 {
    font-size: 50px;
    color: #e91e63;
    display: none;
    text-align: center;
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    background: rgba(255,255,255,0.6);
    padding: 10px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(255,182,193,0.5);
    animation: trollBlink 0.3s infinite alternate, trollJump 0.3s infinite ease-in-out;
  }

  @keyframes trollBlink {
    0% { opacity: 1; }
    50% { opacity: 0.2; }
    100% { opacity: 1; }
  }

  @keyframes trollJump {
    0%,100% { transform: translateX(-50%) translateY(0) scale(1); }
    50% { transform: translateX(-50%) translateY(-15px) scale(1.15); }
  }

  .left-hint {
    position: absolute;
    left: 10%;
    top: 50%;
    transform: translateY(-50%);
    font-size: 26px;
    color: #ff4081;
    animation: blink 1s infinite;
    text-shadow: 2px 2px 5px white;
    z-index: 2;
  }

  video {
    width: 70vw;
    max-width: 900px;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    cursor: pointer;
    position: relative;
    z-index: 1;
  }

  @keyframes blink {
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<audio id="bg-music" src="music.mp3" preload="auto"></audio>
<audio id="funny-music" src="funny.mp3" preload="auto"></audio>
<video id="voiceVideo" src="voice1.mp4" preload="auto" style="display:none"></video>

<div class="intro" id="intro">
  <div class="heart">💖</div>
  <h1>Hi baby💕</h1>
  <button id="startBtn">Bấm vào đây ik :></button>
</div>

<div class="main" id="main">
  <div class="dog"></div>
  <div class="message">Chúc em 20/10 vui vẻ nhe :> 🌹</div>
  <button class="button-flower" id="flowerBtn">Quà đặc biệt 💕🌹</button>
</div>

<div class="popup" id="popup">
  Tặng bbi của ah💕 dù anh dùng chatgpt :v 
</div>

<div class="troll" id="troll">
  <h1 id="trollText">Cho xin 500k =)))</h1>
  <div class="left-hint" id="leftHint">Bấm vào con khủng long đi :></div>
  <video id="trollVideo">
    <source src="KhungLong.mp4" type="video/mp4">
    Trình duyệt của bạn không hỗ trợ video 😿
  </video>
</div>

<script>
  const intro = document.getElementById("intro");
  const main = document.getElementById("main");
  const troll = document.getElementById("troll");
  const popup = document.getElementById("popup");
  const music = document.getElementById("bg-music");
  const funnyMusic = document.getElementById("funny-music");
  const flowerBtn = document.getElementById("flowerBtn");
  const trollText = document.getElementById("trollText");
  const trollVideo = document.getElementById("trollVideo");
  const leftHint = document.getElementById("leftHint");
  const voiceVideo = document.getElementById("voiceVideo");

  leftHint.style.display = "none";

  document.getElementById("startBtn").addEventListener("click", () => {
    intro.style.opacity = "0";
    setTimeout(() => {
      intro.style.display = "none";
      main.style.display = "flex";

      music.volume = 0.8;
      voiceVideo.volume = 1.0;
      music.play().catch(()=>console.log("Trình duyệt chặn nhạc 🎵"));
      voiceVideo.play().catch(()=>console.log("Trình duyệt chặn voice 🎤"));

      popup.style.display = "block";
      setTimeout(() => popup.style.display = "none", 4000);
      createHearts();
    }, 1000);
  });

  voiceVideo.addEventListener("ended", () => {
    setTimeout(() => {
      flowerBtn.classList.add("show");
    }, 400);
  });

  function createHearts() {
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart-fall";
      heart.textContent = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 20 + "px";
      heart.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }, 400);
  }

  flowerBtn.addEventListener("click", () => {
    const flower = document.createElement("div");
    flower.className = "flower";
    flower.style.left = Math.random() * 90 + "vw";
    flower.style.top = Math.random() * 80 + "vh";
    document.body.appendChild(flower);
    setTimeout(() => flower.remove(), 4000);

    setTimeout(() => {
      main.style.display = "none";
      troll.style.display = "flex";
      music.pause();
      voiceVideo.pause();
      funnyMusic.play().catch(()=>console.log("Âm thanh bị chặn 🎶"));
      leftHint.style.display = "block";
      createHearts();
    }, 1500);
  });

  trollVideo.addEventListener("click", () => {
    trollVideo.play();
    trollText.style.display = "block";
  });
</script>

</body>
</html>
